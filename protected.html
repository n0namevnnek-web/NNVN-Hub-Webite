<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NNVN Hub Protected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="protected-body furina-page">
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="assets/video/furina-loop.mp4" type="video/mp4">
  </video>
  <div class="bg-video-overlay strong-overlay"></div>
  <div class="protected-scene protected-scene-furina">
    <div class="protected-overlay"></div>
    <div class="protected-ring"></div>
    <div class="protected-beam"></div>

    <div class="lang-switch protected-lang" aria-label="Language switch">
      <button class="lang-btn active" data-lang="vi" type="button">VI</button>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
    </div>

    <section class="glass protected-card">
      <div class="brand-wrap center-brand">
        <span class="brand">NNVN Hub</span>
        <span class="brand-sub">by N0NAMEVN</span>
      </div>
      <p class="protected-copy" data-i18n="protectedCopy">
        Script này đang được bảo vệ bởi NNVN Hub và chỉ có thể được thực thi trong Roblox.
        Hãy đăng ký để bắt đầu bảo vệ script của riêng bạn.
      </p>
      <div class="hero-actions center-actions">
        <a class="button button-primary" href="index.html#protect" data-i18n="protectedPrimary">Bắt đầu</a>
        <a class="button button-secondary" href="index.html" data-i18n="protectedSecondary">Trang chủ</a>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
